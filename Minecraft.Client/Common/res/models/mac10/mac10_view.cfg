# MAC-10 first-person placement. Edit and save while the game is running - the file is re-read every ~2 seconds
# while the gun is held, so you can tune the look without rebuilding. Units are camera-space blocks (x right, y up, -z forward).
#
# hip_*  : where the gun's grip sits on screen when NOT aiming   (hip_scale = size, hip_yaw/hip_pitch = degrees)
# ads_*  : where the rear sight sits on screen when aiming down sights (centre of the screen is x=0, y=0)
# ads_fov: world FOV multiplier while aiming (1.0 = no zoom, 0.8 = 20% zoom)
# draw_speed: playback speed of the draw animation (the trigger stays locked for Mac10Item::DRAW_LOCK_TICKS)
# key_reload / key_inspect: keyboard keys (a letter, a digit, or a raw virtual-key code). R is NOT usable - the game uses it for crafting /
#   the creative inventory. Pulling the trigger on an empty magazine also reloads, so the key is only needed for a top-up reload.
hip_x=0.32
hip_y=-0.36
hip_z=-0.60
hip_scale=0.62
hip_yaw=-3
hip_pitch=0
ads_x=0.0
ads_y=-0.12
ads_z=-0.40
ads_scale=0.70
ads_fov=0.84
draw_speed=1.5
key_reload=G
key_inspect=F
