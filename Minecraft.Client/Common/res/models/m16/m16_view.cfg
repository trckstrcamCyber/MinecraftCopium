# M16 first-person / third-person placement. Edit and save while the game is running - this file is re-read every ~2 seconds while the gun is held.
# Units are camera-space blocks (x right, y up, -z forward).
# hip_*  : where the gun's grip sits on screen when NOT aiming   (hip_scale = size, hip_yaw/hip_pitch = degrees)
# ads_*  : where the rear sight sits on screen when aiming down sights (centre of the screen is x=0, y=0)
# ads_fov: world FOV multiplier while aiming (1.0 = no zoom, 0.7 = 30% zoom)
# draw_speed: playback speed of the draw animation (guns without a draw clip lift the gun procedurally instead)
# key_reload / key_inspect: letters or raw virtual-key codes. R is NOT usable (crafting / creative inventory).
hip_x=0.3
hip_y=-0.3
hip_z=-0.62
hip_scale=0.26
hip_yaw=-3
hip_pitch=0
ads_x=0.0
ads_y=-0.085
ads_z=-0.34
ads_scale=0.34
ads_fov=0.7
draw_speed=1.5
key_reload=G
key_inspect=F

# Third person (other players, and you in F5 view): the gun is attached to the right hand of the vanilla two-handed aim pose.
# tp_scale: gun size. tp_x / tp_y / tp_z: nudge in the right arm's own space, in blocks (tp_y along the arm, tp_z down(+)/up(-), tp_x sideways).
tp_scale=0.3
tp_x=0.0
tp_y=0.3
tp_z=0.14
